name: Build FM-1 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Install JieLi Linux Toolchain and Postbuild
        run: |
          sudo mkdir -p /opt/jieli
          curl -sL https://pkgman.jieliapp.com/s/linux-toolchain | sudo tar -xJ --strip-components=1 -C /opt/jieli
          sudo mkdir -p /opt/jieli/postbuild
          curl -sL https://pkgman.jieliapp.com/s/linux-postbuild | sudo tar -xJ --strip-components=1 -C /opt/jieli/postbuild
          sudo chmod +x /opt/jieli/common/bin/* /opt/jieli/postbuild/* || true

      - name: Compile Tonic Firmware
        run: |
          mkdir -p build
          # Use JieLi's custom Clang compiler for the FM-1 pi32v2 CPU
          /opt/jieli/common/bin/clang -target pi32v2 -integrated-as -O2 -c src/po32_synth.c -o build/po32_synth.o
          /opt/jieli/common/bin/clang -target pi32v2 -integrated-as -O2 -c src/gui_sequencer.c -o build/gui_sequencer.o
          
          # Link into raw application binary
          /opt/jieli/common/bin/clang -target pi32v2 build/po32_synth.o build/gui_sequencer.o -o build/app.elf -nostdlib
          /opt/jieli/common/bin/llvm-objcopy -O binary build/app.elf build/app.bin

      - name: Package .fwsc File
        run: |
          /opt/jieli/postbuild/isd_download -f build/app.bin \
            -toname FM-1_TONIC.fwsc \
            -dev br28 \
            -boot uboot.boot \
            -cfg cfg_tool.bin \
            -eq eq_cfg_hw.bin

      - name: Upload .fwsc Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FM-1_TONIC_Firmware
          path: FM-1_TONIC.fwsc
