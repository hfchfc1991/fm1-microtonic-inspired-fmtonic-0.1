name: Build FM-1 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies for JieLi Packager
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0

      - name: Download & Extract JieLi Toolchain
        run: |
          mkdir -p /opt/jieli
          curl -sL https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C /opt/jieli || true
          curl -sL https://pkgman.jieliapp.com/s/linux-postbuild | tar -xJ -C /opt/jieli || true

          # Create standard JieLi system link
          PI32_PATH=$(find /opt/jieli -type d -name "pi32v2" | head -n 1)
          sudo ln -sfn "$PI32_PATH" /opt/jieli/pi32v2

      - name: Compile & Link Tonic Firmware
        run: |
          mkdir -p build
          
          PI32_BIN="/opt/jieli/pi32v2/bin"
          export PATH="$PI32_BIN:$PATH"
          echo "==> Using toolchain at: $PI32_BIN"
          
          # 1. Compile C files
          "$PI32_BIN/clang" -target pi32v2 -mcpu=r3 -O2 -c src/po32_synth.c -o build/po32_synth.o
          "$PI32_BIN/clang" -target pi32v2 -mcpu=r3 -O2 -c src/gui_sequencer.c -o build/gui_sequencer.o
          
          # 2. Link objects into ELF
          "$PI32_BIN/ld" build/po32_synth.o build/gui_sequencer.o -o build/app.elf
          
          # 3. Create app.bin using JieLi's -j .text section
          "$PI32_BIN/objcopy" -O binary -j .text build/app.elf build/app.bin

      - name: Package .fwsc File
        run: |
          JL_ISD=$(find /opt/jieli -type f -name "isd_download" | head -n 1)
          chmod +x "$JL_ISD" || true
          echo "==> Running packager at: $JL_ISD"
          
          # Package bootloader, audio configs and code into .fwsc
          "$JL_ISD" -f build/app.bin \
            -toname FM-1_TONIC.fwsc \
            -dev br28 \
            -boot uboot.boot \
            -cfg cfg_tool.bin \
            -eq eq_cfg_hw.bin || \
          "$JL_ISD" -tonorflash -dev br28 -uboot uboot.boot -app build/app.bin -res cfg_tool.bin eq_cfg_hw.bin -toname FM-1_TONIC.fwsc

      - name: Upload .fwsc Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FM-1_TONIC_Firmware
          path: FM-1_TONIC.fwsc
