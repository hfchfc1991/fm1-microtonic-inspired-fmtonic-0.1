name: Build FM-1 Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Extract JieLi Toolchain & Tools
        run: |
          mkdir -p /opt/jieli
          curl -sL https://pkgman.jieliapp.com/s/linux-toolchain | tar -xJ -C /opt/jieli || true
          curl -sL https://pkgman.jieliapp.com/s/linux-postbuild | tar -xJ -C /opt/jieli || true

      - name: Compile & Link Tonic Firmware
        run: |
          mkdir -p build
          
          # Add JieLi toolchain folder directly to PATH
          JL_BIN=$(dirname $(find /opt/jieli -type f -name "clang" | head -n 1))
          export PATH="$JL_BIN:$PATH"
          echo "==> Toolchain path: $JL_BIN"
          
          # 1. Compile C code
          clang -target pi32v2 -mcpu=r3 -O2 -c src/po32_synth.c -o build/po32_synth.o
          clang -target pi32v2 -mcpu=r3 -O2 -c src/gui_sequencer.c -o build/gui_sequencer.o
          
          # 2. Link using clang directly
          clang -target pi32v2 -mcpu=r3 -nostdlib build/po32_synth.o build/gui_sequencer.o -o build/app.elf
          
          # 3. Create app.bin
          llvm-objcopy -O binary build/app.elf build/app.bin

      - name: Package .fwsc File
        run: |
          JL_ISD=$(find /opt/jieli -type f -name "isd_download" | head -n 1)
          chmod +x "$JL_ISD" || true
          echo "==> Using isd_download at: $JL_ISD"
          
          # Package everything into FM-1_TONIC.fwsc
          "$JL_ISD" -f build/app.bin \
            -toname FM-1_TONIC.fwsc \
            -dev br28 \
            -boot uboot.boot \
            -cfg cfg_tool.bin \
            -eq eq_cfg_hw.bin

      - name: Upload .fwsc Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FM-1_TONIC_Firmware
          path: FM-1_TONIC.fwsc
